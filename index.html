<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#6750a4" />
  <meta name="description" content="在手机上制作人物对话、旁白、图片剧情和论坛体内容" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./styles.css" />
  <title>LET'S TALK</title>
</head>
<body>
  <header class="topbar">
    <div><h1>LET'S TALK</h1><small>故事对话制作器</small></div>
    <button id="installBtn" class="ghost hidden">安装到桌面</button>
  </header>
  <nav class="tabs" aria-label="主要功能">
    <button data-page="dialogue" class="active">对话制作</button>
    <button data-page="forum">论坛体</button>
    <button data-page="player">播放预览</button>
    <button data-page="settings">项目</button>
  </nav>

  <main>
    <section id="page-dialogue" class="page active">
      <div class="section-head"><div><h2>剧情节点</h2><p id="nodeCount">0 条内容</p></div><label class="file-btn">导入 TXT<input id="txtInput" type="file" accept=".txt,text/plain" /></label></div>
      <div id="nodeList" class="card-list"></div>
      <div class="add-grid">
        <button data-add-node="dialogue">＋人物对话</button><button data-add-node="narration">＋旁白</button>
        <button data-add-node="image">＋图片</button><button data-add-node="animation">＋动画</button>
      </div>
    </section>

    <section id="page-forum" class="page">
      <div class="section-head"><div><h2>论坛楼层</h2><p id="floorCount">0 个楼层</p></div><button id="addFloor">＋添加楼层</button></div>
      <div id="floorList" class="card-list"></div>
    </section>

    <section id="page-player" class="page player-page">
      <div class="player-toolbar"><span id="playerProgress">0 / 0</span><label class="switch"><input id="autoPlay" type="checkbox" checked /> 自动播放</label></div>
      <div id="stage" class="stage"><div class="empty">请先添加剧情内容</div></div>
      <div class="player-actions"><button id="prevNode" class="ghost">上一条</button><button id="playAction">开始播放</button><button id="nextNode" class="ghost">下一条</button></div>
    </section>

    <section id="page-settings" class="page">
      <h2>项目设置</h2>
      <div class="settings-card">
        <label>项目名称<input id="projectName" type="text" maxlength="50" /></label>
        <label>背景音乐<input id="bgmInput" type="file" accept="audio/*" /></label>
        <div id="bgmStatus" class="hint">未选择背景音乐</div>
        <label class="check"><input id="bgmLoop" type="checkbox" checked /> 循环播放背景音乐</label>
      </div>
      <div class="settings-card">
        <h3>备份与迁移</h3><p class="hint">媒体和项目保存在当前浏览器。请定期导出备份。</p>
        <div class="button-stack"><button id="exportProject">导出项目备份</button><label class="file-btn wide">导入项目备份<input id="importProject" type="file" accept=".json,.letstalk,application/json" /></label><button id="resetProject" class="danger ghost">清空当前项目</button></div>
      </div>
      <div class="settings-card"><h3>安装到桌面</h3><p class="hint">Android 使用 Chrome 的“安装应用”；iPhone 使用 Safari 分享菜单中的“添加到主屏幕”。</p><button id="installBtn2">安装应用</button></div>
    </section>
  </main>

  <dialog id="nodeDialog"><form method="dialog" id="nodeForm"><h3 id="nodeDialogTitle">编辑节点</h3><input id="nodeId" type="hidden" />
    <label id="speakerField">人物名称<input id="speakerInput" maxlength="30" /></label>
    <label id="textField">文本内容<textarea id="textInput" rows="5"></textarea></label>
    <label id="speedField">打字速度 <span id="speedValue">45</span> 毫秒/字<input id="speedInput" type="range" min="10" max="150" value="45" /></label>
    <label id="avatarField">人物头像<input id="avatarInput" type="file" accept="image/*" /></label>
    <label id="mediaField">媒体文件<input id="mediaInput" type="file" accept="image/*,video/*,.gif" /></label>
    <div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button id="saveNode" value="default">保存</button></div>
  </form></dialog>

  <dialog id="floorDialog"><form method="dialog" id="floorForm"><h3>编辑楼层</h3><input id="floorId" type="hidden" />
    <label>发帖人网名<input id="usernameInput" maxlength="30" /></label><label>帖子正文<textarea id="contentInput" rows="5"></textarea></label><label>帖子图片<input id="floorImageInput" type="file" accept="image/*" /></label>
    <div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button id="saveFloor" value="default">保存</button></div>
  </form></dialog>

  <div id="toast" role="status"></div>
  <script src="./app.js" defer></script>
</body>
</html>
